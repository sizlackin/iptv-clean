name: Update IPTV playlist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cleaner.py"
      - ".github/workflows/update-playlist.yml"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip Pillow

      - name: Build cleaned playlist
        run: python cleaner.py

      - name: Commit updated playlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u posters/ logo-status.json

          if git diff --cached --quiet; then
            echo "Playlist is already up to date."
            exit 0
          fi

          git commit -m "Update cleaned IPTV playlist"
          git push
