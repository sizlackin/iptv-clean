name: Update IPTV playlist + Stremio addon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cleaner.py"
      - "build_stremio_addon.py"
      - "epg.py"
      - ".github/workflows/update-playlist.yml"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iptv-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip Pillow

      - name: Build cleaned playlist
        run: python cleaner.py

      - name: Build programme guide
        run: python epg.py
        continue-on-error: true

      - name: Build static Stremio addon
        run: python build_stremio_addon.py

      - name: Commit updated playlist data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u posters/ logo-status.json

          if git diff --cached --quiet; then
            echo "Playlist data is already up to date."
          else
            git commit -m "Update cleaned IPTV playlist"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Stremio addon site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Stremio addon to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
